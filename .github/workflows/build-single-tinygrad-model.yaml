name: Build Single Tinygrad Model and Push

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream commit to build from'
        required: true
        type: string
      custom_name:
        description: 'Custom name for the model (no date, only name)'
        required: false
        type: string
      is_20hz:
        description: 'Is this a 20Hz model'
        required: false
        type: boolean
        default: true
      recompiled_dir:
        description: 'Existing recompiled directory number (e.g. 3 for recompiled3)'
        required: true
        type: number
      json_version:
        description: 'driving_models version number to update (e.g. 5 for driving_models_v5.json)'
        required: true
        type: number
      model_folder:
        description: 'Model folder'
        required: true
        type: choice
        options:
          - Simple Plan Models
          - TR Models
          - DTR Models
          - Custom Merge Models
          - FoF series models
          - Other
      custom_model_folder:
        description: 'Custom model folder name'
        required: false
        type: string
      lat:
        description: 'lat smooth override (decimal, e.g. 0.1)'
        required: false
        type: number
        default: 0.1
      long:
        description: 'long smooth override (decimal, e.g. 0.3)'
        required: false
        type: number
        default: 0.3

jobs:
  build-single:
    runs-on: self-hosted
    env:
      RECOMPILED_DIR: recompiled${{ github.event.inputs.recompiled_dir }}
      JSON_FILE: docs/docs/driving_models_v${{ github.event.inputs.json_version }}.json
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: sunnypilot/sunnypilot-docs
          ref: gh-pages
          path: docs

      - name: Validate recompiled dir and JSON version
        run: |
          if [ ! -d "$RECOMPILED_DIR" ]; then
            echo "Recompiled dir $RECOMPILED_DIR does not exist!"
            exit 1
          fi
          if [ ! -f "$JSON_FILE" ]; then
            echo "JSON file $JSON_FILE does not exist!"
            exit 1
          fi

      - name: Build model
        id: trigger-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sunnypilot-build-model.yaml \
            --ref "${{ github.ref_name }}" \
            -f upstream_branch="${{ github.event.inputs.upstream_branch }}" \
            -f custom_name="${{ github.event.inputs.custom_name }}" \
            -f is_20hz="${{ github.event.inputs.is_20hz }}"

      - name: Wait for model build to finish
        uses: ./.github/workflows/wait-for-action
        with:
          workflow: sunnypilot-build-model.yaml
          branch: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-time: 10
          should-wait-for-start: false

      - name: Download and extract model artifact
        run: |
          mkdir -p "$RECOMPILED_DIR"
          ARTIFACT_NAME="model-${{ github.event.inputs.custom_name || github.event.inputs.upstream_branch }}-*"
          gh run download $(gh run list --workflow=sunnypilot-build-model.yaml --branch="${{ github.ref_name }}" --limit=1 --json databaseId --jq '.[0].databaseId') -n "$ARTIFACT_NAME" --dir "$RECOMPILED_DIR"
          find "$RECOMPILED_DIR" -type f -name '*.zip' -exec unzip -o {} -d "$RECOMPILED_DIR" \;
          find "$RECOMPILED_DIR" -type f -name '*.zip' -delete

      - name: Push recompiled dir to GitLab
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          git clone --depth 1 git@gitlab.com:sunnypilot/public/docs.sunnypilot.ai.git gitlab_docs
          cd gitlab_docs
          git checkout main
          cp -u ../"$RECOMPILED_DIR"/* models/"$(basename $RECOMPILED_DIR)"/
          git add models/"$(basename $RECOMPILED_DIR)"
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git commit -m "Update $(basename $RECOMPILED_DIR) with new/updated model from build-single-tinygrad-model" || echo "No changes to commit"
          git push origin main

      # Update JSON with new model
      - name: Run json_parser.py to update JSON
        run: |
          FOLDER="${{ github.event.inputs.model_folder }}"
          if [ "$FOLDER" = "Other" ]; then
            FOLDER="${{ github.event.inputs.custom_model_folder }}"
          fi
          if [ -n "$FOLDER" ]; then
            python3 docs.sunnypilot.ai/json_parser.py \
              --json-path "$JSON_FILE" \
              --recompiled-dir "$RECOMPILED_DIR" \
              --model-folder "$FOLDER" \
              --lat "${{ github.event.inputs.lat }}" \
              --long "${{ github.event.inputs.long }}"
          else
            python3 docs.sunnypilot.ai/json_parser.py \
              --json-path "$JSON_FILE" \
              --recompiled-dir "$RECOMPILED_DIR" \
              --lat "${{ github.event.inputs.lat }}" \
              --long "${{ github.event.inputs.long }}"
          fi

      - name: Push updated JSON to GitHub docs repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git checkout gh-pages
          cp "../$JSON_FILE" docs/
          git add docs/"$(basename $JSON_FILE)"
          git commit -m "Update $(basename $JSON_FILE) after recompiling model"
          git push origin gh-pages
